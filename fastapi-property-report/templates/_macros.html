{# A dependency-free line chart. `c` comes from line_chart() in main.py. #}
{% macro chart(c, line_colour="#1f6feb") %}
<svg viewBox="0 0 {{ c.width }} {{ c.height }}" width="100%" role="img" style="display:block">
  {% for t in c.yticks %}
  <line x1="{{ c.plot_left }}" x2="{{ c.plot_right }}" y1="{{ t.y }}" y2="{{ t.y }}" stroke="#e4e7ec"/>
  <text x="{{ c.plot_left - 8 }}" y="{{ t.y + 4 }}" text-anchor="end" font-size="11" fill="#667085">{{ t.label }}</text>
  {% endfor %}
  {% for t in c.xticks %}
  <text x="{{ t.x }}" y="{{ c.baseline + 18 }}" text-anchor="middle" font-size="11" fill="#667085">{{ t.label }}</text>
  {% endfor %}
  {% if c.line %}<polyline points="{{ c.line }}" fill="none" stroke="{{ line_colour }}" stroke-width="2.5" stroke-linejoin="round"/>{% endif %}
  {% for d in c.dots %}
  <circle cx="{{ d.x }}" cy="{{ d.y }}" r="6" fill="#d1495b" stroke="#fff" stroke-width="2"><title>Sold {{ d.label }}</title></circle>
  {% endfor %}
</svg>
{% endmacro %}
